<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Hostel Management System</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link rel="stylesheet" href="login.css">

</head>


<body id="loginPage">


    <!-- =====================================================
                         BACK TO HOME
    ====================================================== -->

    <a href="index.html" class="back-home">

        <i class="fa-solid fa-arrow-left"></i>

        Back to Home

    </a>



    <!-- =====================================================
                         MAIN LOGIN PAGE
    ====================================================== -->

    <main class="login-container">


        <!-- =================================================
                         LEFT SIDE
        ================================================== -->

        <section class="lamp-area">


            <!-- =================================================
                         HANGING LAMP
            ================================================== -->

            <div class="hanging-lamp">


                <!-- ONE SINGLE CABLE FROM CEILING -->

                <div class="ceiling-rope"></div>


                <!-- CABLE CONNECTOR -->

                <div class="lamp-connector"></div>


                <!-- LAMP SHADE -->

                <div class="lamp-shade"></div>


                <!-- BULB -->

                <div class="lamp-light"></div>


                <!-- PULL CORD -->

                <div class="pull-cord">

                    <span class="cord-handle"></span>

                </div>


            </div>



            <!-- =================================================
                         LIGHT EFFECT
            ================================================== -->

            <div class="lamp-glow"></div>

            <div class="light-beam"></div>



            <!-- =================================================
                         PARTICLES
            ================================================== -->

            <div class="particles">

                <span class="particle particle-1"></span>

                <span class="particle particle-2"></span>

                <span class="particle particle-3"></span>

                <span class="particle particle-4"></span>

                <span class="particle particle-5"></span>

            </div>



            <!-- =================================================
                         ROBOT
            ================================================== -->

            <div class="robot">


                <!-- ANTENNA -->

                <div class="robot-antenna">

                    <span></span>

                </div>


                <!-- HEAD -->

                <div class="robot-head">


                    <!-- EARS -->

                    <div class="robot-ear robot-ear-left"></div>

                    <div class="robot-ear robot-ear-right"></div>


                    <!-- FACE -->

                    <div class="robot-face">


                        <!-- EYES -->

                        <div class="robot-eyes">


                            <div class="robot-eye">

                                <span></span>

                            </div>


                            <div class="robot-eye">

                                <span></span>

                            </div>


                        </div>


                        <!-- NOSE -->

                        <div class="robot-nose"></div>


                        <!-- MOUTH -->

                        <div class="robot-mouth"></div>


                    </div>

                </div>


                <!-- GROUND GLOW -->

                <div class="robot-ground-glow"></div>


            </div>


        </section>



        <!-- =================================================
                         RIGHT LOGIN SECTION
        ================================================== -->

        <section class="login-section">


            <div class="login-card">


                <!-- HEADER -->

                <div class="login-header">


                    <div class="login-icon">

                        <i class="fa-solid fa-house"></i>

                    </div>


                    <h1>

                        Welcome
                        <span>Back.</span>

                    </h1>


                    <p>

                        Smart Hostel Management System

                    </p>


                </div>



                <!-- LOGIN FORM -->

                <form id="loginForm"
                      class="login-form">


                    <!-- USERNAME -->

                    <div class="input-group">

                        <label for="username">

                            USERNAME

                        </label>


                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>


                            <input
                                type="text"
                                id="username"
                                name="username"
                                placeholder="Enter username"
                                autocomplete="username"
                                required
                            >

                        </div>

                    </div>



                    <!-- PASSWORD -->

                    <div class="input-group">

                        <label for="password">

                            PASSWORD

                        </label>


                        <div class="input-box">

                            <i class="fa-solid fa-lock"></i>


                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required
                            >


                            <button
                                type="button"
                                class="password-toggle"
                                id="passwordToggle"
                            >

                                <i
                                    class="fa-regular fa-eye"
                                    id="eyeIcon"
                                ></i>

                            </button>

                        </div>

                    </div>



                    <!-- OPTIONS -->

                    <div class="form-options">


                        <label class="remember">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a href="#">
                            Forgot password?
                        </a>


                    </div>



                    <!-- ERROR -->

                    <div
                        id="loginError"
                        class="login-error"
                    ></div>



                    <!-- LOGIN BUTTON -->

                    <button
                        type="submit"
                        class="sign-in-button"
                        id="signInButton"
                    >

                        <span id="buttonText">

                            SIGN IN

                        </span>


                        <i class="fa-solid fa-arrow-right"></i>

                    </button>


                </form>


                <div class="demo-info">

                    Secure Hostel Access

                </div>


            </div>

        </section>


    </main>


    <script src="login.js"></script>

</body>

</html>
