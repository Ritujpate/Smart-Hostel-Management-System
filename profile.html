<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - SHMS</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="pages.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <i class="fa-solid fa-bed"></i>
            <span>SHMS</span>
        </div>

        <nav class="sidebar-menu">

            <a href="dashboard.html" class="menu-item">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="profile.html" class="menu-item active">
                <i class="fa-solid fa-user"></i>
                <span>My Profile</span>
            </a>

            <a href="room.html" class="menu-item">
                <i class="fa-solid fa-door-open"></i>
                <span>Room Details</span>
            </a>

            <a href="leave.html" class="menu-item">
                <i class="fa-solid fa-calendar-check"></i>
                <span>Leave Request</span>
            </a>

            <a href="complaints.html" class="menu-item">
                <i class="fa-solid fa-wrench"></i>
                <span>Complaints</span>
            </a>

            <a href="fees.html" class="menu-item">
                <i class="fa-solid fa-wallet"></i>
                <span>Fee Details</span>
            </a>

            <a href="mess.html" class="menu-item">
                <i class="fa-solid fa-utensils"></i>
                <span>Mess Menu</span>
            </a>

        </nav>

        <div class="sidebar-bottom">
            <a href="settings.html" class="menu-item">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>

            <a href="index.html" class="menu-item logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </div>

    </aside>


    <main class="main-content">

        <header class="top-header">
            <h1>My Profile</h1>

            <div class="header-right">
                <div class="notification">
                    <i class="fa-regular fa-bell"></i>
                    <span></span>
                </div>

                <div class="student-profile">
                    <div class="profile-image">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <div class="profile-text">
                        <strong>Rituj Kumar</strong>
                        <small>Student</small>
                    </div>
                </div>
            </div>
        </header>


        <section class="content">

            <div class="profile-layout">

                <div class="profile-card profile-summary">

                    <div class="large-profile">
                        <i class="fa-solid fa-user"></i>
                    </div>

                    <h2>Rituj Kumar</h2>

                    <p>B.Tech (CSIT)</p>

                    <span class="student-badge">
                        Student
                    </span>

                    <button class="primary-btn">
                        <i class="fa-solid fa-pen"></i>
                        Edit Profile
                    </button>

                </div>


                <div class="profile-card">

                    <div class="section-title">
                        <h2>Personal Information</h2>
                    </div>

                    <div class="details-grid">

                        <div>
                            <label>Full Name</label>
                            <strong>Rituj Kumar</strong>
                        </div>

                        <div>
                            <label>Student ID</label>
                            <strong>SHMS2026-001</strong>
                        </div>

                        <div>
                            <label>Email</label>
                            <strong>student@shms.com</strong>
                        </div>

                        <div>
                            <label>Phone</label>
                            <strong>+91 98765 43210</strong>
                        </div>

                        <div>
                            <label>Course</label>
                            <strong>B.Tech CSIT</strong>
                        </div>

                        <div>
                            <label>Year</label>
                            <strong>3rd Year</strong>
                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>

</body>
</html>
